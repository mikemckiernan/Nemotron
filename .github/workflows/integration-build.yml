name: Integration Docs Build

# Builds docs from playbook_rc1 and publishes to GitHub Pages at playbook-integration/.

on:
  push:
    branches:
      - playbook_rc1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Build docs
        env:
          CI: "true"
          DOCS_VERSION: "playbook-integration"
        run: uv run --group docs sphinx-build docs docs/_build/html

      - name: Clean build artifacts
        run: |
          find docs/_build -name .doctrees -prune -exec rm -rf {} \;
          find docs/_build -name .buildinfo -exec rm {} \;

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          destination_dir: playbook-integration
          keep_files: true
